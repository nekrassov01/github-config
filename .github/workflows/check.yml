name: Drift Check
on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  drift-check:
    runs-on: ubuntu-slim
    env:
      GITHUB_TOKEN: ${{ secrets.GH_INFRA_GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
      - name: Install gh-infra
        run: gh extension install babarot/gh-infra
      - name: Run drift check
        run: gh infra plan ./src/go/ --ci
