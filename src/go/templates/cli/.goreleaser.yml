version: 2
project_name: <% .Repo.Name %>
env:
  - GO111MODULE=on
before:
  hooks:
    - go mod tidy
builds:
  - main: ./cmd/<% .Vars.CommandName %>/
    binary: <% .Vars.CommandName %>
    ldflags:
      - -s -w
      - -X github.com/<% .Repo.FullName %>.version={{ .Version }}
      - -X github.com/<% .Repo.FullName %>.revision={{ .ShortCommit }}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: "checksums.txt"
snapshot:
  version_template: "{{ .Version }}-next"
changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
brews:
  - repository:
      owner: nekrassov01
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
      branch: main
    directory: Formula
    homepage: "https://github.com/<% .Repo.FullName %>"
    description: <% .Vars.Description %>
    license: "MIT"
release:
  use_existing_draft: true
